name: CI

on:
  push:
    branches:
      - main
      - new-env-switch-api
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install package
        run: python -m pip install -e .

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Run extension unit tests
        run: npm run test:unit

      - name: Build extension bundle
        run: npm run build

      - name: Run socket protocol tests
        run: npm run test:socket

      - name: Package test VSIX
        run: npm run package:test

      - name: Upload test VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcubed-vscode-venv-switcher-vsix
          path: vscode-extension/test/*.vsix
          if-no-files-found: error
          retention-days: 14

  secure-bundle:
    name: Secure bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install Python build dependency
        run: python -m pip install wheel

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Build secure bundle
        run: scripts/build-secure-bundle --require-clean

      - name: Verify secure bundle
        run: scripts/verify-secure-bundle build/secure-bundle/gcubed-build-switcher-secure.tar.gz

      - name: Upload secure bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcubed-build-switcher-secure-bundle
          path: build/secure-bundle/gcubed-build-switcher-secure.tar.gz
          if-no-files-found: error
          retention-days: 14
